baseURL = "https://streetcorsamods.github.io/"
locale = "en-US"
title = "Street Corsa"
enableRobotsTXT = true
disableKinds = ["taxonomy", "term"]

[params]
  description = "A car career on top of Assetto Corsa: buy a tired car, build it in your garage, race it for cash and pink slips."
  repo = "https://github.com/streetcorsamods/street-corsa"
  # The game's release the Downloads page points at. Set released = true once the tag and its files are up.
  release = "0.1.1"
  released = true
  # PayPal donate link (https://www.paypal.com/donate/?hosted_button_id=... or https://paypal.me/...).
  # Empty hides every donate badge on the site.
  donate = "https://www.paypal.com/donate/?hosted_button_id=BBLVSCJBKK3Q6"

[menus]
  [[menus.main]]
    name = "Home"
    pageRef = "/"
    weight = 1
  [[menus.main]]
    name = "News"
    pageRef = "/news"
    weight = 2
  [[menus.main]]
    name = "Downloads"
    pageRef = "/downloads"
    weight = 3
  [[menus.main]]
    name = "Tutorials"
    pageRef = "/tutorials"
    weight = 4
  [[menus.main]]
    name = "About"
    pageRef = "/about"
    weight = 5

[markup.goldmark.renderer]
  unsafe = false

# A picture on a line of its own is a figure (render-image.html), not a picture in a paragraph
[markup.goldmark.parser]
  wrapStandAloneImageWithinParagraph = false

[outputs]
  home = ["HTML", "RSS"]
  section = ["HTML", "RSS"]
