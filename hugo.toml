baseURL = "https://streetcorsamods.github.io/"
locale = "en-US"
title = "Street Corsa"
enableRobotsTXT = true
defaultContentLanguage = "en"
disableKinds = ["taxonomy", "term"]

# English at /, the others under /es/ and /pt/. A page is translated by a file beside it: install.md -> install.es.md.
# A page with no translation has none in that language: links to it go to the English page (layouts/partials/page.html).
# The templates' words: i18n/<lang>.toml. params.flag: the language switcher's flag, a country in
# layouts/partials/flag.html (us, es, ar, br, pt).
[languages.en]
  weight = 1
  label = "English"
  [languages.en.params]
    flag = "us"
[languages.es]
  weight = 2
  locale = "es"
  label = "Español"
  [languages.es.params]
    flag = "es"
[languages.pt]
  weight = 3
  locale = "pt-BR"
  label = "Português"
  [languages.pt.params]
    flag = "br"

[params]
  repo = "https://github.com/streetcorsamods/street-corsa"
  # The game's release the Downloads page points at. Set released = true once the tag and its files are up.
  release = "0.1.4"
  released = true
  # PayPal donate link (https://www.paypal.com/donate/?hosted_button_id=... or https://paypal.me/...).
  # Empty hides every donate badge on the site.
  donate = "https://paypal.me/streetcorsamods"
  # YouTube id of the trailer on the home page (poster: static/images/trailer.jpg). Empty hides it.
  trailer = "RplpUJnWvow"

# Where to find us: the Contact page's cards, in this order, and the footer's icons (foot = false keeps one off the
# footer). An empty url hides it everywhere. icon: a name in layouts/partials/icon.html. A card's words, in every
# language, English too: i18n/<lang>.toml, social_<the name, letters only, in lower case>.
[[params.social]]
  name = "Discord"
  url = "https://discord.gg/uebqRhN6w"
  icon = "discord"
[[params.social]]
  name = "GitHub"
  url = "https://github.com/streetcorsamods/street-corsa/issues"
  icon = "github"
  foot = false
# The mods' source for modders (one SVN repository per mod, the modding wiki, tickets): not for players, so off the footer
[[params.social]]
  name = "SourceForge"
  url = "https://sourceforge.net/p/streetcorsa-mods/"
  icon = "sourceforge"
  foot = false
[[params.social]]
  name = "YouTube"
  url = "https://www.youtube.com/@StreetCorsa-d5c"
  icon = "youtube"
[[params.social]]
  name = "Itch.io"
  url = "https://streetcorsamods.itch.io/street-corsa"
  icon = "itch"
[[params.social]]
  name = "Email"
  url = "mailto:streetcorsa.mods@gmail.com"
  icon = "mail"
  show = "streetcorsa.mods@gmail.com"
# Still in review there; give it its url once it is up.
[[params.social]]
  name = "Overtake"
  url = ""
  icon = ""

# The names, in every language, English too: i18n/<lang>.toml, by identifier.
[menus]
  [[menus.main]]
    identifier = "home"
    pageRef = "/"
    weight = 1
  [[menus.main]]
    identifier = "news"
    pageRef = "/news"
    weight = 2
  [[menus.main]]
    identifier = "downloads"
    pageRef = "/downloads"
    weight = 3
  [[menus.main]]
    identifier = "ac"
    pageRef = "/assetto-corsa"
    weight = 4
  [[menus.main]]
    identifier = "tutorials"
    pageRef = "/tutorials"
    weight = 5
  [[menus.main]]
    identifier = "about"
    pageRef = "/about"
    weight = 6
  [[menus.main]]
    identifier = "contact"
    pageRef = "/contact"
    weight = 7

[markup.goldmark.renderer]
  unsafe = false

# A picture on a line of its own is a figure (render-image.html), not a picture in a paragraph
[markup.goldmark.parser]
  wrapStandAloneImageWithinParagraph = false

[outputs]
  home = ["HTML", "RSS"]
  section = ["HTML", "RSS"]
