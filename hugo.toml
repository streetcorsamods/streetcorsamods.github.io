baseURL = "https://streetcorsamods.github.io/"
locale = "en-US"
title = "Street Corsa"
enableRobotsTXT = true
disableKinds = ["taxonomy", "term"]

[params]
  description = "A car career on top of Assetto Corsa: buy a tired car, build it in your garage, race it for cash and pink slips."
  repo = "https://github.com/streetcorsamods/street-corsa"
  # The game's release the Downloads page points at. Set released = true once the tag and its files are up.
  release = "0.1.2"
  released = true
  # PayPal donate link (https://www.paypal.com/donate/?hosted_button_id=... or https://paypal.me/...).
  # Empty hides every donate badge on the site.
  donate = "https://paypal.me/streetcorsamods"
  # YouTube id of the trailer on the home page (poster: static/images/trailer.jpg). Empty hides it.
  trailer = "7cYqSJmkBtc"

# Where to find us: the Contact page's cards, in this order, and the footer's icons (foot = false keeps one off the
# footer). An empty url hides it everywhere. icon: a name in layouts/partials/icon.html.
[[params.social]]
  name = "Discord"
  url = "https://discord.gg/uebqRhN6w"
  icon = "discord"
  text = "Questions, help with an install, your builds and race stories. The quickest answer."
[[params.social]]
  name = "GitHub"
  url = "https://github.com/streetcorsamods/street-corsa/issues"
  icon = "github"
  foot = false
  text = "Found a bug, or want something in the game? Open an issue. Say what you did and what happened."
[[params.social]]
  name = "YouTube"
  url = "https://www.youtube.com/@StreetCorsa-d5c"
  icon = "youtube"
  text = "Trailers and videos of the game."
[[params.social]]
  name = "Itch.io"
  url = "https://streetcorsamods.itch.io/street-corsa"
  icon = "itch"
  text = "The game's page on itch.io. Rate it, leave a comment, follow it for updates."
[[params.social]]
  name = "Email"
  url = "mailto:streetcorsa.mods@gmail.com"
  icon = "mail"
  show = "streetcorsa.mods@gmail.com"
  text = "Licensing, press, and anything private. Questions and bugs get a quicker answer on Discord."
# Still in review there; give it its url once it is up.
[[params.social]]
  name = "Overtake"
  url = ""
  icon = ""
  text = "The game on Overtake, with its comments."

[menus]
  [[menus.main]]
    name = "Home"
    pageRef = "/"
    weight = 1
  [[menus.main]]
    name = "News"
    pageRef = "/news"
    weight = 2
  [[menus.main]]
    name = "Downloads"
    pageRef = "/downloads"
    weight = 3
  [[menus.main]]
    name = "Tutorials"
    pageRef = "/tutorials"
    weight = 4
  [[menus.main]]
    name = "About"
    pageRef = "/about"
    weight = 5
  [[menus.main]]
    name = "Contact"
    pageRef = "/contact"
    weight = 6

[markup.goldmark.renderer]
  unsafe = false

# A picture on a line of its own is a figure (render-image.html), not a picture in a paragraph
[markup.goldmark.parser]
  wrapStandAloneImageWithinParagraph = false

[outputs]
  home = ["HTML", "RSS"]
  section = ["HTML", "RSS"]
