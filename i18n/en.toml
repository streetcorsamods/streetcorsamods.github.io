os_game = "Street Corsa is open source, and everybody is welcome to make it better: fix a bug, add a feature, translate it, balance it. The code is MIT and the game's own content CC BY 4.0. Fork it on GitHub, change it, and send a pull request."
os_game_mods = "Every mod we publish is open too: the settings and their places, the engine packs and our Assetto Corsa cars have their files on SourceForge, one SVN repository each. Ask to join and your work ships in the next version, with your name in the credits. Or write a mod of your own."
os_mod = "This mod is open source ({{ .licence }}), and everybody is welcome to make it better: a more detailed model, a missing part, numbers closer to the real thing. Ask to join, work on a branch of your own, and what's merged goes out in its next version, with your name in its credits."
os_ac = "This car is open source ({{ .licence }}), and everybody is welcome to make it better: its model, its skins, its physics, its sounds. Work directly in the KN5 model and the data files; ask to join, and what's merged goes out in its next version, with your name in its credits."
os_no_source = "Its files aren't on SourceForge yet. Until they are, <a href=\"{{ .href }}\" target=\"_blank\" rel=\"noopener\">open a ticket</a> and ask for them."
