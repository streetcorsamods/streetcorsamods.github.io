# The AC Mods page (content/assetto-corsa): our mods for Assetto Corsa itself, apart from Street Corsa.
# Same fields as downloads.yaml. url: the zip's SourceForge download
# (https://sourceforge.net/projects/streetcorsa-mods/files/<folder>/<zip>/download); none: "Coming soon".
# id: the car's AC folder name, and its page's front matter mod (content/assetto-corsa/<page>.md).

groups:
  - id: cars
    title: Cars
    text: Cars for Assetto Corsa on its own, no Street Corsa needed. Drag the zip onto Content Manager, or copy its content folder into your Assetto Corsa folder. Custom Shaders Patch recommended.
    es: { title: Autos, text: "Autos para Assetto Corsa solo, sin Street Corsa. Arrastra el zip a Content Manager, o copia su carpeta content en la carpeta de Assetto Corsa. Se recomienda Custom Shaders Patch." }
    pt: { title: Carros, text: "Carros para o Assetto Corsa sozinho, sem o Street Corsa. Arraste o zip para o Content Manager, ou copie a pasta content dele para a pasta do Assetto Corsa. Custom Shaders Patch recomendado." }
    items:
      - name: Mercedes-Benz SS Erdmann & Rossi 1930
        id: mercedes_benz_ss_er_1930
        url: https://sourceforge.net/projects/streetcorsa-mods/files/mercedes-benz-ss-erdman-rossi-1930/mercedes_benz_ss_er_1930_v1.0.zip/download
        size: 50 MB
        kind: AC car
        text: "A one-off: the supercharged SS that left the works as a racer in 1930 and wears a one-off Erdmann & Rossi sport roadster body, Best of Show at Pebble Beach. 7.1 litre six, 225 PS with the blower in, and you hear it whine. Period dials, opening doors, wipers, moving axle, damage and dirt. Four skins."
        es: { text: "Un ejemplar único: el SS con compresor que salió de fábrica como auto de carreras en 1930 y lleva una carrocería sport roadster única de Erdmann & Rossi, Best of Show en Pebble Beach. Seis cilindros de 7,1 litros, 225 PS con el compresor, y se oye su silbido. Relojes de época, puertas que abren, limpiaparabrisas, eje que se mueve, daños y suciedad. Cuatro pinturas." }
        pt: { text: "Um exemplar único: o SS com compressor que saiu da fábrica como carro de corrida em 1930 e veste uma carroceria sport roadster única da Erdmann & Rossi, Best of Show em Pebble Beach. Seis cilindros de 7,1 litros, 225 PS com o compressor, e dá para ouvir o assobio. Mostradores de época, portas que abrem, limpadores, eixo que se move, danos e sujeira. Quatro pinturas." }
      - name: Cadillac V-16 Roadster 1930
        id: cadillac_v16_roadster_1930
        url: https://sourceforge.net/projects/streetcorsa-mods/files/cadillac-v16-roadster-1930/cadillac_v16_roadster_1930_v1.0.zip/download
        size: 50 MB
        kind: AC car
        text: The Fleetwood roadster with the 452 cu in V16, 175 bhp and over 300 lb-ft from idle. Engine-turned dash with six working dials, pleated leather, Pilot-Ray lamps, twin side-mounts. Opening doors, wipers, moving axle, damage and dirt. Eight skins from real cars.
        es: { text: "El roadster Fleetwood con el V16 de 452 pulgadas cúbicas, 175 bhp y más de 300 lb-pie desde ralentí. Tablero de aluminio torneado con seis relojes que funcionan, cuero plisado, faros Pilot-Ray y dos ruedas de auxilio en los guardabarros. Puertas que abren, limpiaparabrisas, eje que se mueve, daños y suciedad. Ocho pinturas de autos reales." }
        pt: { text: "O roadster Fleetwood com o V16 de 452 polegadas cúbicas, 175 bhp e mais de 300 lb-pé desde a marcha lenta. Painel de alumínio torneado com seis mostradores que funcionam, couro pregueado, faróis Pilot-Ray e dois estepes nos para-lamas. Portas que abrem, limpadores, eixo que se move, danos e sujeira. Oito pinturas de carros reais." }
      - name: Ford V8 Pickup 1932
        id: ford_v8_pickup_1932
        url: https://sourceforge.net/projects/streetcorsa-mods/files/ford-v8-pickup-1932/ford_v8_pickup_1932_v1.7.zip/download
        size: 91 MB
        kind: AC car
        text: The 1932 closed-cab pickup with the flathead V8, three-speed, wire wheels and an ahooga horn. Opening doors, moving axle, damage and dirt. Seven skins.
        es: { text: "La pickup de cabina cerrada de 1932 con el V8 flathead, caja de tres marchas, ruedas de rayos y bocina ahooga. Puertas que abren, eje que se mueve, daños y suciedad. Siete pinturas." }
        pt: { text: "A picape de cabine fechada de 1932 com o V8 flathead, câmbio de três marchas, rodas raiadas e buzina ahooga. Portas que abrem, eixo que se move, danos e sujeira. Sete pinturas." }
      - name: Auburn 851 Supercharged Speedster 1935
        id: auburn_851_speedster_1935
        url: https://sourceforge.net/projects/streetcorsa-mods/files/auburn-851-sc-speedster-boattail-1935/auburn_851_speedster_1935_v1.2.zip/download
        size: 45 MB
        kind: AC car
        text: Gordon Buehrig's boattail with the supercharged straight-eight, 150 bhp, and the Dual-Ratio axle on Extra A (needs CSP 0.2.11 or newer). Moving axle, damage and dirt. Fourteen skins in the 1935-36 Auburn colours.
        es: { text: "El boattail de Gordon Buehrig con el ocho en línea sobrealimentado, 150 bhp, y el eje Dual-Ratio en Extra A (requiere CSP 0.2.11 o posterior). Eje que se mueve, daños y suciedad. Catorce pinturas en los colores Auburn de 1935-36." }
        pt: { text: "O boattail de Gordon Buehrig com o oito em linha sobrealimentado, 150 bhp, e o eixo Dual-Ratio no Extra A (requer o CSP 0.2.11 ou mais recente). Eixo que se move, danos e sujeira. Catorze pinturas nas cores Auburn de 1935-36." }
      - name: Chevrolet Master DeLuxe Coupe 1937
        id: chevrolet_master_deluxe_1937
        url: https://sourceforge.net/projects/streetcorsa-mods/files/chevrolet-master-deluxe-1937/chevrolet_master_deluxe_1937_v1.5.zip/download
        size: 26 MB
        kind: AC car
        text: The 1937 business coupe with the Blue Flame six, floor shift and Knee-Action front end. Moving axle, wipers, damage and dirt. Thirteen skins in the 1937 Duco colours.
        es: { text: "El cupé de 1937 con el seis cilindros Blue Flame, palanca al piso y suspensión delantera Knee-Action. Eje que se mueve, limpiaparabrisas, daños y suciedad. Trece pinturas en los colores Duco de 1937." }
        pt: { text: "O cupê de 1937 com o seis cilindros Blue Flame, câmbio no assoalho e suspensão dianteira Knee-Action. Eixo que se move, limpadores, danos e sujeira. Treze pinturas nas cores Duco de 1937." }
      - name: Chevrolet 3100 Pickup 1950
        id: chevrolet_3100_pickup_1950
        url: https://sourceforge.net/projects/streetcorsa-mods/files/chevrolet-3100-pickup-1950/chevrolet_3100_pickup_1950_v1.0.zip/download
        size: 37 MB
        kind: AC car
        text: The Advance-Design half-ton with the 216 Thriftmaster six, column shift, five-window cab, oak stake racks and wide whitewalls. Opening doors, wipers, moving axle, damage and dirt. Twelve 1950 truck colours.
        es: { text: "La pickup Advance-Design de media tonelada con el seis cilindros Thriftmaster 216, palanca en la columna, cabina de cinco ventanillas, barandas de roble y bandas blancas anchas. Puertas que abren, limpiaparabrisas, eje que se mueve, daños y suciedad. Doce colores de camioneta de 1950." }
        pt: { text: "A picape Advance-Design de meia tonelada com o seis cilindros Thriftmaster 216, câmbio na coluna, cabine de cinco janelas, grades de carvalho e faixa branca larga. Portas que abrem, limpadores, eixo que se move, danos e sujeira. Doze cores de picape de 1950." }
      - name: Buick Roadmaster Skylark 1953
        id: buick_skylark_1953
        url: https://sourceforge.net/projects/streetcorsa-mods/files/buick-roadmaster-skylark-1953/buick_skylark_1953_v1.6.zip/download
        size: 55 MB
        kind: AC car
        text: The 50th-anniversary convertible, 1,690 built. Chopped windscreen, 322 Nailhead, Dynaflow, Kelsey-Hayes wire wheels. Moving axle, wipers, damage and dirt. Ten skins, each with its factory interior.
        es: { text: "El convertible del 50.º aniversario, 1.690 fabricados. Parabrisas recortado, Nailhead 322, Dynaflow, ruedas de rayos Kelsey-Hayes. Eje que se mueve, limpiaparabrisas, daños y suciedad. Diez pinturas, cada una con su interior de fábrica." }
        pt: { text: "O conversível do 50º aniversário, 1.690 fabricados. Para-brisa rebaixado, Nailhead 322, Dynaflow, rodas raiadas Kelsey-Hayes. Eixo que se move, limpadores, danos e sujeira. Dez pinturas, cada uma com o interior de fábrica." }
      - name: Buick Roadmaster 1957
        id: buick_roadmaster_1957
        url: https://sourceforge.net/projects/streetcorsa-mods/files/buick-roadmaster-75-riviera-1957/buick_roadmaster_1957_v1.5.zip/download
        size: 39 MB
        kind: AC car
        text: The Riviera two-door hardtop with the 364 Nailhead, 300 hp, and the horizontal speedometer. Moving axle, wipers, damage and dirt. Eleven factory two-tones.
        es: { text: "El hardtop de dos puertas Riviera con el Nailhead 364, 300 hp y el velocímetro horizontal. Eje que se mueve, limpiaparabrisas, daños y suciedad. Once bicolores de fábrica." }
        pt: { text: "O hardtop de duas portas Riviera com o Nailhead 364, 300 hp e o velocímetro horizontal. Eixo que se move, limpadores, danos e sujeira. Onze saia-e-blusa de fábrica." }
      - name: Oldsmobile Starfire 98 1957
        id: oldsmobile_starfire_98_1957
        url: https://sourceforge.net/projects/streetcorsa-mods/files/oldsmobile-starfire-98-1957/oldsmobile_starfire_98_1957_v1.0.zip/download
        size: 38 MB
        kind: AC car
        text: The 1957 Ninety-Eight convertible with the 371 Rocket T-400 V8, 277 bhp, Jetaway Hydra-Matic and the two-tone cove. Wipers, moving axle, damage and dirt. Twelve 1957 colours, each with its two-tone leather.
        es: { text: "El convertible Ninety-Eight de 1957 con el V8 Rocket T-400 de 371, 277 bhp, Jetaway Hydra-Matic y la moldura lateral bicolor. Limpiaparabrisas, eje que se mueve, daños y suciedad. Doce colores de 1957, cada uno con su cuero bicolor." }
        pt: { text: "O conversível Ninety-Eight de 1957 com o V8 Rocket T-400 de 371, 277 bhp, Jetaway Hydra-Matic e a faixa lateral em duas cores. Limpadores, eixo que se move, danos e sujeira. Doze cores de 1957, cada uma com o couro em duas cores." }
      - name: Chevrolet Impala Sedan 1960
        id: chevrolet_impala_sedan_1960
        url: https://sourceforge.net/projects/streetcorsa-mods/files/chevrolet-impala-sedan-1960/chevrolet_impala_sedan_1960_v1.8.zip/download
        size: 52 MB
        kind: AC car
        text: The four-door Impala with the 348 Turbo-Thrust V8, 250 hp, Powerglide, X-frame and whitewalls. Quad headlamps, wipers, moving axle, damage and dirt. Twenty-four skins, the 1960 colours and two-tones, each with its houndstooth interior.
        es: { text: "El Impala de cuatro puertas con el V8 348 Turbo-Thrust, 250 hp, Powerglide, chasis en X y bandas blancas. Cuatro faros, limpiaparabrisas, eje que se mueve, daños y suciedad. Veinticuatro pinturas, los colores y bicolores de 1960, cada una con su interior pied-de-poule." }
        pt: { text: "O Impala de quatro portas com o V8 348 Turbo-Thrust, 250 hp, Powerglide, chassi em X e faixa branca. Quatro faróis, limpadores, eixo que se move, danos e sujeira. Vinte e quatro pinturas, as cores e saia-e-blusa de 1960, cada uma com o interior pied-de-poule." }
      - name: Buick Riviera 1963
        id: buick_riviera_1963
        url: https://sourceforge.net/projects/streetcorsa-mods/files/buick-riviera-1963/buick_riviera_1963_v1.5.zip/download
        size: 43 MB
        kind: AC car
        text: The first-year Riviera. 401 Nailhead, 325 hp, Twin Turbine, brushed-aluminium dash and walnut console. Sixteen skins.
        es: { text: "El Riviera del primer año. Nailhead 401, 325 hp, Twin Turbine, tablero de aluminio cepillado y consola de nogal. Dieciséis pinturas." }
        pt: { text: "O Riviera do primeiro ano. Nailhead 401, 325 hp, Twin Turbine, painel de alumínio escovado e console de nogueira. Dezesseis pinturas." }
      - name: Oldsmobile Cutlass Supreme Holiday Sedan 1971
        id: oldsmobile_cutlass_supreme_1971
        url: https://sourceforge.net/projects/streetcorsa-mods/files/oldsmobile-cutlass-supreme-holiday-sedan-1971/oldsmobile_cutlass_supreme_1971_v1.5.zip/download
        size: 47 MB
        kind: AC car
        text: The four-door Cutlass Supreme hardtop with the Rocket 350 four-barrel, 260 hp, Turbo Hydra-matic and a walnut-grain dash. Opening doors, wipers, quad headlamps, damage and dirt. Sixteen skins, each with its factory interior.
        es: { text: "El Cutlass Supreme hardtop de cuatro puertas con el Rocket 350 de cuatro bocas, 260 hp, Turbo Hydra-matic y tablero con imitación nogal. Puertas que abren, limpiaparabrisas, cuatro faros, daños y suciedad. Dieciséis pinturas, cada una con su interior de fábrica." }
        pt: { text: "O Cutlass Supreme hardtop de quatro portas com o Rocket 350 quadrijet, 260 hp, Turbo Hydra-matic e painel imitando nogueira. Portas que abrem, limpadores, quatro faróis, danos e sujeira. Dezesseis pinturas, cada uma com o interior de fábrica." }
      - name: Plymouth Satellite Sebring 1971
        id: plymouth_satellite_sebring_1971
        url: https://sourceforge.net/projects/streetcorsa-mods/files/plymouth-satellite-sebring-1971/plymouth_satellite_sebring_1971_v1.5.zip/download
        size: 47 MB
        kind: AC car
        text: The two-door hardtop with the 383 four-barrel, 300 hp, TorqueFlite and the woodgrain Rallye cluster. Opening doors, wipers, quad headlamps, damage and dirt. Sixteen skins.
        es: { text: "El hardtop de dos puertas con el 383 de cuatro bocas, 300 hp, TorqueFlite y el tablero Rallye imitación madera. Puertas que abren, limpiaparabrisas, cuatro faros, daños y suciedad. Dieciséis pinturas." }
        pt: { text: "O hardtop de duas portas com o 383 de quadrijet, 300 hp, TorqueFlite e o painel Rallye imitando madeira. Portas que abrem, limpadores, quatro faróis, danos e sujeira. Dezesseis pinturas." }
