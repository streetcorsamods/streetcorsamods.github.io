# The Downloads page. Each item is one file.
# file: an asset of the game's GitHub release (hugo.toml params.release); {v} becomes that version.
#       Shown as a download only once params.released is true.
# url:  a download hosted anywhere else (wins over file).
# Neither: listed as "Coming soon".
# id:   the mod's id: its page (content/mods, front matter mod) links here and the card links to the page.
# es:, pt: the group's or item's words in that language (title, text, name, for); what they leave out stays English.
#       kind and badge: i18n/<lang>.toml (kind_..., badge_...).

groups:
  - id: game
    title: The game
    text: Install this first. On its own it is the garage and the races, with no town yet.
    es: { title: El juego, text: "Instálalo primero. Solo, es el taller y las carreras, todavía sin ciudad." }
    pt: { title: O jogo, text: "Instale primeiro. Sozinho, ele é a garagem e as corridas, ainda sem cidade." }
    items:
      - name: Street Corsa
        file: StreetCorsa-{v}.msi
        size: 125 MB
        kind: Installer
        text: The game. Windows 10/11, 64-bit. No admin rights needed.
        es: { text: "El juego. Windows 10/11, 64 bits. No necesita permisos de administrador." }
        pt: { text: "O jogo. Windows 10/11, 64 bits. Não precisa de permissão de administrador." }

  - id: settings
    title: Settings
    text: A setting is the career you play. Install at least one. Mod Manager → Install mods.
    es: { title: Ambientaciones, text: "Una ambientación es la carrera que juegas. Instala al menos una. Mod Manager → Install mods." }
    pt: { title: Cenários, text: "Um cenário é a carreira que você joga. Instale pelo menos um. Mod Manager → Install mods." }
    items:
      - name: Street Rod
        id: streetrod
        file: StreetCorsa-streetrod-0.1.1.zip
        size: 277 MB
        kind: Setting
        badge: Default
        text: Los Angeles, 1970. Buy a tired old car, build its engine on the stand and race Main Street at night for cash and pink slips, until the King will race you.
        es: { text: "Los Ángeles, 1970. Compra un auto viejo y cansado, arma su motor en el soporte y corre en Main Street de noche por dinero o apostando el auto, hasta que el King acepte correr contigo." }
        pt: { text: "Los Angeles, 1970. Compre um carro velho e cansado, monte o motor no cavalete e corra na Main Street à noite por dinheiro ou valendo o carro, até o King aceitar correr com você." }
      - name: Touge Nights
        id: touge_nights
        file: StreetCorsa-touge_nights-0.1.0.zip
        size: 68 MB
        kind: Setting
        text: Gunma, 2002. A tired AE86, turbo coupes on the passes after dark. Touge runs and drift battles. Needs Assetto Corsa's Japanese Pack.
        es: { text: "Gunma, 2002. Un AE86 cansado, cupés turbo en los pasos de montaña de noche. Carreras de touge y batallas de drift. Necesita el Japanese Pack de Assetto Corsa." }
        pt: { text: "Gunma, 2002. Um AE86 cansado, cupês turbo nas serras depois que escurece. Corridas de touge e batalhas de drift. Precisa do Japanese Pack do Assetto Corsa." }

