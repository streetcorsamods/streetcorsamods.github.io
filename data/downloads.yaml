# The Downloads page. Each item is one file.
# file: an asset of the game's GitHub release (hugo.toml params.release); {v} becomes that version.
#       Shown as a download only once params.released is true.
# url:  a download hosted anywhere else (wins over file).
# Neither: listed as "Coming soon".
# id:   the mod's id: its page (content/mods, front matter mod) links here and the card links to the page.

groups:
  - id: game
    title: The game
    text: Install this first. On its own it is the garage and the races, with no town yet.
    items:
      - name: Street Corsa
        file: StreetCorsa-{v}.msi
        size: 125 MB
        kind: Installer
        text: The game. Windows 10/11, 64-bit. No admin rights needed.

  - id: settings
    title: Settings
    text: A setting is the career you play. Install at least one. Mod Manager → Install mods.
    items:
      - name: Street Rod
        file: StreetCorsa-streetrod-{v}.zip
        size: 277 MB
        kind: Setting
        badge: Default
        text: Los Angeles, 1970. Buy a tired old car, build its engine on the stand and race Main Street at night for cash and pink slips, until the King will race you.
      - name: Touge Nights
        file: StreetCorsa-touge_nights-{v}.zip
        size: 68 MB
        kind: Setting
        text: Gunma, 2002. A tired AE86, turbo coupes on the passes after dark. Touge runs and drift battles. Needs Assetto Corsa's Japanese Pack.

  - id: engines
    title: Engine packs
    text: Real engines to build, part by part, for Street Rod. Without one, a car runs on its own Assetto Corsa engine.
    items:
      - { name: "Chrysler V8 (318 to 426 Hemi)", kind: Engine pack }
      - { name: "Chevrolet small block (265 to 350)", kind: Engine pack }
      - { name: "Chevrolet big block (396 to 454)", kind: Engine pack }
      - name: "Chevrolet W (348 / 409 / 427 Z11)"
        id: chevy_w_v8
        file: StreetCorsa-chevy_w_v8-1.0.zip
        size: 30 MB
        kind: Engine pack
        text: "1958-65: the 348 with the Tri-Power, the Impala SS 409s on one and two four-barrels, the 427 Z11."
      - { name: "Chevrolet inline six (235 / 250)", kind: Engine pack }
      - name: "Pontiac V8 (389 / 400 / 455)"
        id: pontiac_v8
        file: StreetCorsa-pontiac_v8-1.0.zip
        size: 28 MB
        kind: Engine pack
        text: "The GTO's 389 and Tri-Power, Ram Air II to IV, the 455 and the '77 Trans Am's W72."
      - name: "Oldsmobile V8 (400 / 455)"
        id: olds_v8
        file: StreetCorsa-olds_v8-1.0.zip
        size: 26 MB
        kind: Engine pack
        text: "The 400s and the 455: the L69 Tri-Carb, the 4-4-2, the W-30 with Force-Air, the Hurst/Olds."
      - name: "Buick V8 (Nailhead, 400 to 455)"
        id: buick_v8
        file: StreetCorsa-buick_v8-1.0.zip
        size: 45 MB
        kind: Engine pack
        text: "The Nailhead 364 to 425 with the dual-quad Super Wildcat, and the big block: GS 400, GS 455 and its Stage 1."
      - name: "Cadillac V8 (331 to 500)"
        id: cadillac_v8
        file: StreetCorsa-cadillac_v8-1.0.zip
        size: 43 MB
        kind: Engine pack
        text: "From the 1949 331 to the 472 and 500, with the Eldorados' dual quads and 3x2s."
      - { name: "Ford flathead V8", kind: Engine pack }
      - { name: "Ford Y-block (239 to 312)", kind: Engine pack }
      - { name: "Ford Windsor (260 to 351W)", kind: Engine pack }
      - { name: "Ford FE (332 to 428)", kind: Engine pack }
      - name: "Ford Cleveland (351C, 351M / 400)"
        id: ford_cleveland
        file: StreetCorsa-ford_cleveland-1.0.zip
        size: 35 MB
        kind: Engine pack
        text: "The 351 Cleveland (2V, 4V, Cobra Jet, Boss 351) and the tall-deck 400 and 351M."
      - name: "Ford 385 (429 / 460, Boss 429)"
        id: ford_385
        file: StreetCorsa-ford_385-1.0.zip
        size: 32 MB
        kind: Engine pack
        text: "The 429 Thunder Jet, Cobra Jet and Super Cobra Jet, the 460, and the Boss 429 on its semi-hemi heads."
      - name: "Ford Falcon six (188 / 221)"
        id: ford_six
        file: StreetCorsa-ford_six-2.0.zip
        size: 18 MB
        kind: Engine pack
        text: "The Argentine Falcon's 188 and 221, the Sprint's 221 SP and Oreste Berta's racing 221."
      - name: "Lincoln-Mercury V8 (Y-block, MEL)"
        id: lincoln_v8
        file: StreetCorsa-lincoln_v8-1.0.zip
        size: 36 MB
        kind: Engine pack
        text: "The Lincoln Y-block of the Continental Mark II, and the MEL big block up to the 462."

  - id: addons
    title: Add-ons
    text: Small extras for the garage.
    items:
      - { name: Bush DAC10 radio, kind: Add-on, file: StreetCorsa-bushradio-1.0.zip, size: 2 MB, text: "A 1950 radio on the garage's welder." }
