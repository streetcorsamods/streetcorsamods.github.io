{{/* Home trailer. Context: the YouTube video id. Shows our own poster; YouTube (nocookie) loads only when the visitor
     presses play, so the page itself loads nothing from YouTube. Without JavaScript the poster is a plain link. */}}
<div class="trailer">
  <h2>{{ T "trailer" }}</h2>
  <a class="video" href="https://www.youtube.com/watch?v={{ . }}" data-id="{{ . }}" target="_blank" rel="noopener"
     aria-label="{{ T "trailer_play" }}" data-title="{{ T "trailer_title" }}">
    <img src="{{ "images/trailer.jpg" | relURL }}" alt="" width="1280" height="720" loading="lazy">
    <span class="play" aria-hidden="true"></span>
  </a>
  <p class="trailer-note">{{ T "trailer_note" }} <a href="https://www.youtube.com/watch?v={{ . }}" target="_blank" rel="noopener">{{ T "trailer_watch" }}</a></p>
</div>
<script>
document.querySelectorAll(".video[data-id]").forEach(function (a) {
  a.addEventListener("click", function (e) {
    e.preventDefault();
    var f = document.createElement("iframe");
    f.src = "https://www.youtube-nocookie.com/embed/" + a.dataset.id + "?autoplay=1&rel=0";
    f.title = a.dataset.title;
    f.allow = "autoplay; encrypted-media; picture-in-picture; fullscreen";
    f.allowFullscreen = true;
    var box = document.createElement("div");
    box.className = "video";
    box.appendChild(f);
    a.replaceWith(box);
  });
});
</script>
