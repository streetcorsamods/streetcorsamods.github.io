{{- /* A download item's button: Download when it has a link (dl-href.html), Coming soon when not. */ -}}
{{- $href := partial "dl-href.html" . -}}
{{- if $href -}}
  <a class="btn" href="{{ $href }}"{{ if hasPrefix $href "http" }} target="_blank" rel="noopener"{{ end }}>{{ T "download" }}</a>
{{- else -}}
  <span class="btn off" aria-disabled="true">{{ T "coming_soon" }}</span>
{{- end -}}
