{{/* A country's flag, small and simplified, inline so the page loads nothing more. Context: the country's code
     (hugo.toml languages.<lang>.params.flag). 3:2, drawn on 30 x 20. */}}
{{- $flags := dict
  "us" `<rect width="30" height="20" fill="#b22234"/><path d="M0 1.54h30M0 4.62h30M0 7.69h30M0 10.77h30M0 13.85h30M0 16.92h30" stroke="#fff" stroke-width="1.54"/><rect width="12" height="10.77" fill="#3c3b6e"/><g fill="#fff"><circle cx="2" cy="1.8" r=".55"/><circle cx="6" cy="1.8" r=".55"/><circle cx="10" cy="1.8" r=".55"/><circle cx="4" cy="4" r=".55"/><circle cx="8" cy="4" r=".55"/><circle cx="2" cy="6.2" r=".55"/><circle cx="6" cy="6.2" r=".55"/><circle cx="10" cy="6.2" r=".55"/><circle cx="4" cy="8.4" r=".55"/><circle cx="8" cy="8.4" r=".55"/></g>`
  "es" `<rect width="30" height="20" fill="#aa151b"/><rect y="5" width="30" height="10" fill="#f1bf00"/>`
  "ar" `<rect width="30" height="20" fill="#74acdf"/><rect y="6.67" width="30" height="6.67" fill="#fff"/><circle cx="15" cy="10" r="2" fill="#f6b40e"/>`
  "br" `<rect width="30" height="20" fill="#009c3b"/><path d="M15 2.2 27.2 10 15 17.8 2.8 10z" fill="#ffdf00"/><circle cx="15" cy="10" r="4.6" fill="#002776"/><path d="M10.6 8.9a12 12 0 0 1 8.9 2.6" fill="none" stroke="#fff" stroke-width=".8"/>`
  "pt" `<rect width="30" height="20" fill="#f00"/><rect width="12" height="20" fill="#060"/><circle cx="12" cy="10" r="3.6" fill="#ff0"/><circle cx="12" cy="10" r="2.3" fill="#f00"/><rect x="11" y="8.6" width="2" height="2.6" rx=".4" fill="#fff"/>`
-}}
{{- with index $flags . -}}
<svg class="flag" viewBox="0 0 30 20" width="21" height="14" aria-hidden="true" focusable="false">{{ . | safeHTML }}</svg>
{{- end -}}
